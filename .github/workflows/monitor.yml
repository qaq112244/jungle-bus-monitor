name: Jungle Bus Ticket Monitor

on:
  schedule:
    # 每天日本時間 08:00 - 16:45 (對應 UTC 23:00 - 07:45) 每 15 分鐘執行一次
    - cron: '7,22,37,52 23,0-7 * * *'
  # 支援在 GitHub Actions 頁面手動點擊觸發
  workflow_dispatch:

jobs:
  check-ticket:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許將更新後的網頁與紀錄推送回 GitHub 倉庫

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: pip install requests

      - name: 執行狀態檢查並更新紀錄
        run: python check_ticket.py

      - name: 提交並發布最新紀錄
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json history.log README.md index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update monitor history [skip ci]" && git push)
